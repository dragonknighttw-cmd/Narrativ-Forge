name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/backend
    steps:
1      - name: Pin checkout to exact triggering SHA
        run: |
          git fetch --no-tags --prune --depth=1 origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "CI source SHA=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify Alembic baseline
        run: |
          rm -f /tmp/narrativ-ci.db
          DATABASE_URL=sqlite:////tmp/narrativ-ci.db PYTHONPATH=. python -m alembic upgrade head
          DATABASE_URL=sqlite:////tmp/narrativ-ci.db PYTHONPATH=. python -m alembic current
      - name: Run backend unit + security regression tests
        run: PYTHONPATH=. pytest -m "unit or security" -vv --junitxml=/tmp/backend-unit-security.xml
      - name: Upload backend unit/security test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-security-test-report
          path: /tmp/backend-unit-security.xml
          if-no-files-found: ignore

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: narrativ_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d narrativ_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
1      - name: Pin checkout to exact triggering SHA
        run: |
          git fetch --no-tags --prune --depth=1 origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "CI source SHA=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Apply PostgreSQL migrations
        env:
          DATABASE_URL: postgresql://postgres:ci-test-password@localhost:5432/narrativ_test
        run: PYTHONPATH=. python -m alembic upgrade head
      - name: Run backend integration tests
        env:
          DATABASE_URL: postgresql://postgres:ci-test-password@localhost:5432/narrativ_test
          REDIS_URL: redis://localhost:6379/0
        run: PYTHONPATH=. pytest -m integration -vv --junitxml=/tmp/backend-integration.xml
      - name: Upload backend integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-report
          path: /tmp/backend-integration.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/frontend
    steps:
1      - name: Pin checkout to exact triggering SHA
        run: |
          git fetch --no-tags --prune --depth=1 origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "CI source SHA=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Require npm lockfile
        run: test -f package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build


  e2e:
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/frontend
    steps:
1      - name: Pin checkout to exact triggering SHA
        run: |
          git fetch --no-tags --prune --depth=1 origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "CI source SHA=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r ../backend/requirements.txt
      - name: Start backend
        working-directory: web-platform/backend
        env:
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: |
          mkdir -p storage/uploads
          test -n "$BOOTSTRAP_ADMIN_PASSWORD" || { echo "BOOTSTRAP_ADMIN_PASSWORD GitHub Secret is required"; exit 1; }
          CORS_ORIGINS=http://localhost:3000 DATABASE_URL=sqlite:///./narrativ_forge.db PYTHONPATH=. python -m alembic upgrade head
          BOOTSTRAP_ADMIN_EMAIL=admin@narrativ.local DATABASE_URL=sqlite:///./narrativ_forge.db PYTHONPATH=. python scripts/bootstrap_admin.py
          CORS_ORIGINS=http://localhost:3000 PYTHONPATH=. uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/narrativ-backend.log 2>&1 &
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen("http://localhost:8000/api/v1/health", timeout=2)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("backend did not become ready")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Require npm lockfile
        run: test -f package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build frontend with CI API URL
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build
      - name: Start frontend
        run: |
          NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1 npm run start > /tmp/narrativ-frontend.log 2>&1 &
          node -e "const http=require('http'); let n=0; const f=()=>http.get('http://localhost:3000/login',r=>{if(r.statusCode===200)process.exit(0);setTimeout(f,1000)}).on('error',()=>{if(++n>30)process.exit(1);setTimeout(f,1000)});f()"
      - name: Run E2E tests
        env:
          E2E_ADMIN_EMAIL: admin@narrativ.local
          E2E_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: npm run e2e
