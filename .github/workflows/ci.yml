name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cloudflare-whisper-worker:
    name: Cloudflare Whisper Worker contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-platform/cloudflare/whisper-worker
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Worker authentication and safe error responses
        run: node --experimental-strip-types --test test/worker.test.mjs

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-platform/backend
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify Alembic baseline
        env:
          DATABASE_URL: sqlite:////tmp/narrativ-ci.db
        run: |
          rm -f /tmp/narrativ-ci.db
          PYTHONPATH=. python -m alembic upgrade head
          PYTHONPATH=. python -m alembic current
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect

          inspector = inspect(create_engine(os.environ["DATABASE_URL"]))
          expected_tables = {"brain_soul_context", "brain_soul_syntheses"}
          expected_indexes = {
              "brain_soul_context": {"ix_brain_soul_context_key", "ix_brain_soul_context_active"},
              "brain_soul_syntheses": {"ix_brain_soul_synth_period", "ix_brain_soul_synth_topic", "ix_brain_soul_synth_created"},
          }
          tables = set(inspector.get_table_names())
          assert expected_tables <= tables, f"missing brain soul tables: {expected_tables - tables}"
          for table, expected in expected_indexes.items():
              actual = {item["name"] for item in inspector.get_indexes(table)}
              assert expected <= actual, f"{table} missing indexes: {expected - actual}"
          print("brain soul migration schema verified on SQLite")
          PY
      - name: Run backend unit + security regression tests
        run: PYTHONPATH=. pytest -m "unit or security" -vv --junitxml=/tmp/backend-unit-security.xml
      - name: Upload backend unit/security test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-security-test-report
          path: /tmp/backend-unit-security.xml
          if-no-files-found: ignore

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-platform/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: narrativ_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d narrativ_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify backend source revision
        run: |
          git fetch --no-tags --prune --depth=1 origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile app/services/orchestration.py
          sed -n '1,35p' app/services/orchestration.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Apply PostgreSQL migrations
        env:
          DATABASE_URL: postgresql://postgres:ci-test-password@localhost:5432/narrativ_test
        run: |
          PYTHONPATH=. python -m alembic upgrade head
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect

          inspector = inspect(create_engine(os.environ["DATABASE_URL"]))
          expected_tables = {"brain_soul_context", "brain_soul_syntheses"}
          expected_indexes = {
              "brain_soul_context": {"ix_brain_soul_context_key", "ix_brain_soul_context_active"},
              "brain_soul_syntheses": {"ix_brain_soul_synth_period", "ix_brain_soul_synth_topic", "ix_brain_soul_synth_created"},
          }
          tables = set(inspector.get_table_names())
          assert expected_tables <= tables, f"missing brain soul tables: {expected_tables - tables}"
          for table, expected in expected_indexes.items():
              actual = {item["name"] for item in inspector.get_indexes(table)}
              assert expected <= actual, f"{table} missing indexes: {expected - actual}"
          print("brain soul migration schema verified on PostgreSQL")
          PY
      - name: Run backend integration tests
        env:
          DATABASE_URL: postgresql://postgres:ci-test-password@localhost:5432/narrativ_test
          REDIS_URL: redis://localhost:6379/0
        run: PYTHONPATH=. pytest -m integration -vv --junitxml=/tmp/backend-integration.xml
      - name: Upload backend integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-report
          path: /tmp/backend-integration.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-platform/frontend
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Require npm lockfile
        run: test -f package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Build and verify standalone frontend package
        run: |
          npm run build
          test -f .next/standalone/server.js
          if [ -d public ]; then cp -R public .next/standalone/; fi
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          test -d .next/standalone/.next/static


  e2e:
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-platform/frontend
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r ../backend/requirements.txt
      - name: Start backend
        working-directory: apps/web-platform/backend
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          mkdir -p storage/uploads
          test -n "$E2E_EMAIL" || { echo "E2E_EMAIL GitHub Secret is required"; exit 1; }
          test -n "$E2E_PASSWORD" || { echo "E2E_PASSWORD GitHub Secret is required"; exit 1; }
          CORS_ORIGINS=http://localhost:3000 DATABASE_URL=sqlite:///./narrativ_forge.db PYTHONPATH=. python -m alembic upgrade head
          APP_ENV=testing DATABASE_URL=sqlite:///./narrativ_forge.db PYTHONPATH=. python scripts/seed_e2e_users.py
          # Generate an ephemeral encryption key for this disposable E2E backend only.
          export OAUTH_ENCRYPTION_KEY="$(PYTHONPATH=. python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          CORS_ORIGINS=http://localhost:3000 PYTHONPATH=. uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/narrativ-backend.log 2>&1 &
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen("http://localhost:8000/api/v1/health", timeout=2)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("backend did not become ready")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Require npm lockfile
        run: test -f package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and package standalone frontend for E2E
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_E2E_AUTH_MODE: "true"
        run: |
          npm run build
          test -f .next/standalone/server.js
          if [ -d public ]; then cp -R public .next/standalone/; fi
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          test -d .next/standalone/.next/static
      - name: Start standalone frontend
        run: |
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/narrativ-frontend.log 2>&1 &
          node -e "const http=require('http'); let n=0; const f=()=>http.get('http://localhost:3000/login',r=>{if(r.statusCode===200)process.exit(0);setTimeout(f,1000)}).on('error',()=>{if(++n>30)process.exit(1);setTimeout(f,1000)});f()"
      - name: Verify standalone frontend serves static assets
        run: |
          node <<'NODE'
          (async () => {
            const origin = "http://127.0.0.1:3000";
            const htmlResponse = await fetch(origin + "/login");
            if (!htmlResponse.ok) throw new Error(`/login returned ${htmlResponse.status}`);
            const html = await htmlResponse.text();
            const assets = [...html.matchAll(/(?:src|href)="([^"]*\\/_next\\/static\\/[^"]+)"/g)]
              .map(match => match[1].replaceAll("&amp;", "&"))
              .filter((url, index, all) => all.indexOf(url) === index);
            if (assets.length === 0) throw new Error("No Next.js static assets referenced by /login");
            for (const asset of assets) {
              const response = await fetch(new URL(asset, origin));
              if (!response.ok) throw new Error(`Static asset ${asset} returned ${response.status}`);
              const body = await response.arrayBuffer();
              if (body.byteLength === 0) throw new Error(`Static asset ${asset} was empty`);
            }
            console.log(`Verified ${assets.length} standalone static assets`);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Run E2E tests
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_SECOND_EMAIL: e2e-second-tenant@example.test
          E2E_SECOND_PASSWORD: E2e-Second-Password-ChangeMe1!
        run: npm run e2e
