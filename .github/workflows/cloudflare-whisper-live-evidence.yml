name: Cloudflare Whisper Live Evidence

on:
  workflow_dispatch:
    inputs:
      confirm_live_inference:
        description: "Confirm one small real Cloudflare Workers AI inference request (may consume quota)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-whisper-live-evidence
  cancel-in-progress: false

jobs:
  live-authenticated-audio:
    if: ${{ inputs.confirm_live_inference == true }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate target and credentials without printing values
        env:
          WORKER_URL: ${{ secrets.CLOUDFLARE_WHISPER_WORKER_URL }}
          SHARED_SECRET: ${{ secrets.CLOUDFLARE_WHISPER_SHARED_SECRET }}
          EXPECTED_WORKER_HOST: narrativ-forge-whisper.narrativ-forge.workers.dev
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          raw_url = os.environ.get("WORKER_URL", "")
          secret = os.environ.get("SHARED_SECRET", "")
          if not raw_url:
              raise SystemExit("::error::Missing production environment secret CLOUDFLARE_WHISPER_WORKER_URL")
          if not secret:
              raise SystemExit("::error::Missing production environment secret CLOUDFLARE_WHISPER_SHARED_SECRET")
          if len(secret) < 32:
              raise SystemExit("::error::Shared secret must be at least 32 characters; rotate it consistently across GitHub, Render API, and Cloudflare Worker.")
          parsed = urlsplit(raw_url)
          if parsed.scheme != "https" or parsed.hostname != os.environ["EXPECTED_WORKER_HOST"]:
              raise SystemExit("::error::Worker URL must be the expected HTTPS workers.dev hostname; check CLOUDFLARE_WHISPER_WORKER_URL.")
          if parsed.username or parsed.password or parsed.query or parsed.fragment or parsed.path not in ("", "/"):
              raise SystemExit("::error::Worker URL must contain only the HTTPS origin, with no credentials, query, fragment, or custom path.")
          config_path = Path("web-platform/cloudflare/whisper-worker/wrangler.jsonc")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          allowed_origin = config.get("vars", {}).get("ALLOWED_ORIGIN", "")
          if not allowed_origin.startswith("https://"):
              raise SystemExit("::error::ALLOWED_ORIGIN must be an HTTPS origin in wrangler.jsonc.")
          print("Worker host, HTTPS URL, and secret presence/length checks passed; values remain redacted.")
          PY

      - name: Generate a two-second synthetic WAV fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:sample_rate=16000:duration=2" -ac 1 -c:a pcm_s16le -y "$RUNNER_TEMP/whisper-live-fixture.wav"
          test -s "$RUNNER_TEMP/whisper-live-fixture.wav"

      - name: Verify unauthenticated rejection and authenticated audio inference
        env:
          WORKER_URL: ${{ secrets.CLOUDFLARE_WHISPER_WORKER_URL }}
          SHARED_SECRET: ${{ secrets.CLOUDFLARE_WHISPER_SHARED_SECRET }}
          AUDIO_PATH: ${{ runner.temp }}/whisper-live-fixture.wav
          EVIDENCE_PATH: ${{ runner.temp }}/cloudflare-whisper-live-evidence.json
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import urlsplit
          from uuid import uuid4

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)

          def send(req):
              try:
                  with opener.open(req, timeout=90) as response:
                      return response.status, response.headers, response.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.headers, exc.read()

          def safe_error(body):
              try:
                  value = json.loads(body)
              except (json.JSONDecodeError, UnicodeDecodeError):
                  return None
              allowed = {
                  "Origin not allowed",
                  "Invalid or expired processing token",
                  "Episode token mismatch",
                  "Method not allowed",
                  "WAV audio is required",
                  "Empty audio payload",
                  "Audio payload exceeds 50 MB",
                  "Audio payload exceeds the signed duration estimate",
                  "Whisper inference failed",
              }
              error = value.get("error") if isinstance(value, dict) else None
              return error if error in allowed else None

          url = os.environ["WORKER_URL"].rstrip("/")
          parsed_url = urlsplit(url)
          secret = os.environ["SHARED_SECRET"]
          config = json.loads(Path("web-platform/cloudflare/whisper-worker/wrangler.jsonc").read_text(encoding="utf-8"))
          allowed_origin = config["vars"]["ALLOWED_ORIGIN"]
          episode_id = "live-evidence-" + uuid4().hex
          audio = Path(os.environ["AUDIO_PATH"]).read_bytes()
          evidence = {
              "commit_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "production_verified": False,
              "test_scope": "one synthetic 2-second WAV; authenticated Cloudflare Whisper endpoint contract",
              "worker_host": parsed_url.hostname,
              "fixture_sha256": hashlib.sha256(audio).hexdigest(),
              "unauthenticated_rejected": False,
              "authenticated_inference_succeeded": False,
              "transcript_text_saved": False,
              "redirects_followed": False,
          }
          try:
              req = urllib.request.Request(url, data=audio, method="POST", headers={
                  "Content-Type": "audio/wav",
                  "X-Narrativ-Episode": episode_id,
                  "Origin": allowed_origin,
              })
              status, headers, body = send(req)
              evidence["unauthenticated_status"] = status
              evidence["unauthenticated_error"] = safe_error(body)
              evidence["unauthenticated_content_type"] = headers.get("Content-Type", "").split(";")[0]
              evidence["unauthenticated_cf_ray_present"] = bool(headers.get("CF-Ray"))
              if status != 401:
                  if status == 403 and evidence["unauthenticated_error"] == "Origin not allowed":
                      raise RuntimeError("Worker rejected the configured Origin. Check ALLOWED_ORIGIN in wrangler.jsonc and redeploy the Worker.")
                  if status in (301, 302, 303, 307, 308):
                      raise RuntimeError("Worker URL redirected; use the canonical workers.dev URL without redirects.")
                  raise RuntimeError(f"Expected unauthenticated HTTP 401, got HTTP {status}; safe_error={evidence['unauthenticated_error']!r}.")
              evidence["unauthenticated_rejected"] = True

              payload = {
                  "sub": "narrativ-live-evidence",
                  "episode_id": episode_id,
                  "exp": int(time.time()) + 180,
                  "jti": str(uuid4()),
                  "max_audio_seconds": 3,
              }
              encoded = base64.urlsafe_b64encode(json.dumps(payload, separators=(",", ":")).encode()).decode().rstrip("=")
              signature = hmac.new(secret.encode(), encoded.encode(), hashlib.sha256).digest()
              token = encoded + "." + base64.urlsafe_b64encode(signature).decode().rstrip("=")
              req = urllib.request.Request(url, data=audio, method="POST", headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "audio/wav",
                  "X-Narrativ-Episode": episode_id,
                  "Origin": allowed_origin,
              })
              status, headers, body = send(req)
              evidence["authenticated_status"] = status
              evidence["authenticated_error"] = safe_error(body)
              evidence["authenticated_content_type"] = headers.get("Content-Type", "").split(";")[0]
              if status != 200:
                  if status == 401:
                      raise RuntimeError("Authenticated request returned HTTP 401. GitHub's shared secret does not match the deployed Worker secret.")
                  raise RuntimeError(f"Authenticated inference returned HTTP {status}; safe_error={evidence['authenticated_error']!r}.")
              result = json.loads(body)
              if result.get("provider") != "cloudflare_workers_ai" or result.get("episode_id") != episode_id:
                  raise RuntimeError("Provider or episode identity in response did not match the request.")
              if not isinstance(result.get("text"), str) or not isinstance(result.get("vtt"), str):
                  raise RuntimeError("Response omitted expected transcript/VTT string fields.")
              evidence.update({
                  "authenticated_inference_succeeded": True,
                  "provider": result.get("provider"),
                  "model": result.get("model"),
                  "response_episode_matches": True,
                  "transcript_field_present": "text" in result,
                  "vtt_field_present": "vtt" in result,
                  "word_count": result.get("word_count") if isinstance(result.get("word_count"), int) else None,
              })
              print("CLOUDFLARE_WHISPER_LIVE_EVIDENCE_OK")
          finally:
              Path(os.environ["EVIDENCE_PATH"]).write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload redacted live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-whisper-live-evidence
          path: ${{ runner.temp }}/cloudflare-whisper-live-evidence.json
          if-no-files-found: warn
          retention-days: 14
