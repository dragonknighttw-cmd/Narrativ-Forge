name: Deploy Cloudflare Whisper Worker

# Manual-only: updating a production shared secret must be an explicit owner action.
on:
  workflow_dispatch:
    inputs:
      confirm_render_secret_synced:
        description: "Confirm Render API CLOUDFLARE_WHISPER_SHARED_SECRET already matches the GitHub production secret"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-whisper-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_render_secret_synced == true }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-platform/cloudflare/whisper-worker
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment credentials without printing values
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_WHISPER_SHARED_SECRET_RAW: ${{ secrets.CLOUDFLARE_WHISPER_SHARED_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN_RAW" || { echo "::error::Missing CLOUDFLARE_API_TOKEN (repository or production environment secret)"; exit 1; }
          test -n "$CF_ACCOUNT_ID_RAW" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID (repository or production environment secret)"; exit 1; }
          test -n "$CF_WHISPER_SHARED_SECRET_RAW" || { echo "::error::Missing production environment secret CLOUDFLARE_WHISPER_SHARED_SECRET"; exit 1; }
          SECRET_LENGTH="$(printf '%s' "$CF_WHISPER_SHARED_SECRET_RAW" | tr -d '\r\n' | wc -c | tr -d ' ')"
          if [ "$SECRET_LENGTH" -lt 32 ]; then
            echo "::error::CLOUDFLARE_WHISPER_SHARED_SECRET must be at least 32 characters. Use the same strong value in GitHub production secrets and the Render API environment."
            exit 1
          fi
          echo "Cloudflare credentials are present and shared-secret length is acceptable; values remain redacted."

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest typescript

      - name: Deploy Worker source
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '\r\n')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_ID_RAW" | tr -d '\r\n')"
          npx wrangler deploy

      - name: Configure the matching Worker secret
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_WHISPER_SHARED_SECRET_RAW: ${{ secrets.CLOUDFLARE_WHISPER_SHARED_SECRET }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '\r\n')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_ID_RAW" | tr -d '\r\n')"
          printf '%s' "$CF_WHISPER_SHARED_SECRET_RAW" | tr -d '\r\n' | npx wrangler secret put NARRATIV_SHARED_SECRET
          echo "Worker secret synchronized from the protected production environment (value redacted)."

      - name: Verify deployed Worker handler without AI inference
        env:
          WORKER_URL: https://narrativ-forge-whisper.narrativ-forge.workers.dev
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          config = json.loads(Path("wrangler.jsonc").read_text(encoding="utf-8"))
          origin = config.get("vars", {}).get("ALLOWED_ORIGIN", "")
          request = urllib.request.Request(
              __import__("os").environ["WORKER_URL"],
              method="GET",
              headers={"Origin": origin, "Accept": "application/json", "User-Agent": "Narrativ-Forge-Deploy-Smoke/1.0"},
          )
          opener = urllib.request.build_opener(NoRedirect)
          try:
              with opener.open(request, timeout=20) as response:
                  status, headers, body = response.status, response.headers, response.read(2048)
          except urllib.error.HTTPError as exc:
              status, headers, body = exc.code, exc.headers, exc.read(2048)
          try:
              payload = json.loads(body)
          except (json.JSONDecodeError, UnicodeDecodeError):
              payload = {}
          error = payload.get("error") if isinstance(payload, dict) else None
          if status == 405 and error == "Method not allowed":
              print("Worker handler smoke passed; no audio or AI inference was sent.")
          elif status == 403 and headers.get("Content-Type", "").split(";")[0].lower() != "application/json" and headers.get("CF-Ray"):
              raise SystemExit(f"::error::Cloudflare edge returned non-JSON HTTP 403 before the Worker handler; CF-Ray={headers.get('CF-Ray')}. Check edge/account access and deployed hostname. No AI inference was sent.")
          else:
              raise SystemExit(f"::error::Expected Worker JSON HTTP 405 method guard, got HTTP {status}, content_type={headers.get('Content-Type', '').split(';')[0]!r}, error={error!r}, CF-Ray={headers.get('CF-Ray', 'absent')}. No AI inference was sent.")
          PY
