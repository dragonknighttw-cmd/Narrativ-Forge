name: Deploy Cloudflare Whisper Worker

on:
  push:
    branches: [main]
    paths:
      - "web-platform/cloudflare/whisper-worker/**"
      - ".github/workflows/cloudflare-whisper.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/cloudflare/whisper-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest typescript

      - name: Deploy Worker
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          npx wrangler deploy

      - name: Configure Worker secret
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_WHISPER_SHARED_SECRET_RAW: ${{ secrets.CLOUDFLARE_WHISPER_SHARED_SECRET }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          printf '%s' "$CF_WHISPER_SHARED_SECRET_RAW" | tr -d '\r\n' | npx wrangler secret put NARRATIV_SHARED_SECRET
