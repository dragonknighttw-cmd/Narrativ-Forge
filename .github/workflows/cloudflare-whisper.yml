name: Deploy Cloudflare Whisper Worker

on:
  push:
    branches: [main]
    paths:
      - "web-platform/cloudflare/whisper-worker/**"
      - ".github/workflows/cloudflare-whisper.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/cloudflare/whisper-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest typescript

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Configure Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_WHISPER_SHARED_SECRET: ${{ secrets.CLOUDFLARE_WHISPER_SHARED_SECRET }}
        run: |
          printf '%s' "$CF_WHISPER_SHARED_SECRET" | npx wrangler secret put NARRATIV_SHARED_SECRET
