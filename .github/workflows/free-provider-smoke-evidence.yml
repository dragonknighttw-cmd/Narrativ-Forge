name: Free-tier Provider Smoke Evidence

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Run exactly one synthetic request against this provider"
        required: true
        type: choice
        options:
          - groq
          - cloudflare-workers-ai
          - gemini
          - mistral
          - cohere
          - nvidia
      confirm_free_tier:
        description: "Confirm this selected key/model is eligible for a free tier and accept one test request"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    name: One-provider free-tier smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web-platform/backend
    env:
      PYTHONPATH: .
      AI_PROVIDER_TIMEOUT_SECONDS: "20"
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: \${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web-platform/backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run one selected provider smoke request
        env:
          PROVIDER_ID: \${{ inputs.provider }}
          CONFIRM_FREE_TIER: \${{ inputs.confirm_free_tier }}
          GROQ_API_KEY: \${{ inputs.provider == 'groq' && secrets.GROQ_API_KEY || '' }}
          GROQ_FREE_TIER_ENABLED: \${{ inputs.provider == 'groq' && inputs.confirm_free_tier }}
          CLOUDFLARE_ACCOUNT_ID: \${{ inputs.provider == 'cloudflare-workers-ai' && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
          CLOUDFLARE_API_TOKEN: \${{ inputs.provider == 'cloudflare-workers-ai' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_AI_FREE_TIER_ENABLED: \${{ inputs.provider == 'cloudflare-workers-ai' && inputs.confirm_free_tier }}
          GEMINI_API_KEY: \${{ inputs.provider == 'gemini' && secrets.GEMINI_API_KEY || '' }}
          GEMINI_FREE_TIER_ENABLED: \${{ inputs.provider == 'gemini' && inputs.confirm_free_tier }}
          MISTRAL_API_KEY: \${{ inputs.provider == 'mistral' && secrets.MISTRAL_API_KEY || '' }}
          MISTRAL_FREE_TIER_ENABLED: \${{ inputs.provider == 'mistral' && inputs.confirm_free_tier }}
          COHERE_API_KEY: \${{ inputs.provider == 'cohere' && secrets.COHERE_API_KEY || '' }}
          COHERE_FREE_TIER_ENABLED: \${{ inputs.provider == 'cohere' && inputs.confirm_free_tier }}
          NVIDIA_API_KEY: \${{ inputs.provider == 'nvidia' && secrets.NVIDIA_API_KEY || '' }}
          NVIDIA_FREE_TIER_ENABLED: \${{ inputs.provider == 'nvidia' && inputs.confirm_free_tier }}
        run: |
          python scripts/free_provider_smoke.py \
            --provider "$PROVIDER_ID" \
            --output artifacts/free-provider-smoke-evidence.json

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-provider-smoke-evidence
          path: web-platform/backend/artifacts/free-provider-smoke-evidence.json
          if-no-files-found: ignore
          retention-days: 30
