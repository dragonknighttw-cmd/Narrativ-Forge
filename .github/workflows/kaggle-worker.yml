name: Kaggle Ephemeral Worker Dispatcher

on:
  workflow_dispatch:
    inputs:
      confirm_kaggle_dispatch:
        description: "Confirm permission to query Kaggle and launch one ephemeral session if due work exists"
        type: boolean
        required: true
        default: false
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: kaggle-ephemeral-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    # Scheduled launches are opt-in via the repository Actions variable
    # ENABLE_KAGGLE_DISPATCH=true. Manual launches require explicit confirmation.
    # This keeps an unattended schedule from consuming provider quota unexpectedly.
    if: >-
      (github.event_name == 'schedule' && vars.ENABLE_KAGGLE_DISPATCH == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm_kaggle_dispatch == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dispatcher dependencies
        run: python -m pip install --disable-pip-version-check psycopg2-binary kaggle
      - name: Test dispatcher validation and failure handling
        run: python -m unittest discover -s infra/kaggle -p 'test_*.py' -v
      - name: Validate dispatcher configuration
        env:
          DATABASE_URL: ${{ secrets.KAGGLE_DISPATCH_DATABASE_URL }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          # Accept either a repository Actions variable or secret to avoid
          # silently failing when the owner configured the value as a secret.
          KAGGLE_KERNEL_ID: ${{ vars.KAGGLE_KERNEL_ID || secrets.KAGGLE_KERNEL_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL}" || { echo "::error::Missing Actions secret KAGGLE_DISPATCH_DATABASE_URL"; exit 1; }
          test -n "${KAGGLE_API_TOKEN}" || { echo "::error::Missing Actions secret KAGGLE_API_TOKEN"; exit 1; }
          test -n "${KAGGLE_KERNEL_ID}" || { echo "::error::KAGGLE_KERNEL_ID is empty. Add it as a repository Actions variable or secret (not an Environment-only value unless this job declares that Environment)."; exit 1; }
          if [[ ! "${KAGGLE_KERNEL_ID}" =~ ^[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$ ]]; then
            echo "::error::KAGGLE_KERNEL_ID must use owner/kernel-slug format, for example thuwon/narrativ-forge. The value is not printed."
            exit 1
          fi
          echo "Dispatcher configuration presence and kernel ID format are valid; secret values are not printed."
      - name: Launch one Kaggle session when work is queued
        env:
          DATABASE_URL: ${{ secrets.KAGGLE_DISPATCH_DATABASE_URL }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KERNEL_ID: ${{ vars.KAGGLE_KERNEL_ID || secrets.KAGGLE_KERNEL_ID }}
        run: python infra/kaggle/dispatch.py
