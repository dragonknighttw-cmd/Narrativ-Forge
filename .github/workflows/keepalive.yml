name: Render Backend Keep-Alive

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  ping:
    name: Ping Narrativ Forge API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API Health
        shell: bash
        run: |
          set -euo pipefail
          URL="https://narrativ-forge.onrender.com/api/v1/health"
          echo "Pinging $URL..."
          success=false
          for attempt in {1..3}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || true)
            echo "Attempt $attempt: HTTP $code"
            if [[ "$code" == "200" ]]; then
              success=true
              break
            fi
            sleep 5
          done
          if [[ "$success" != "true" ]]; then
            echo "Warning: $URL did not return 200 on attempt $attempt (HTTP $code)"
          fi
          echo "Keep-alive ping completed."
