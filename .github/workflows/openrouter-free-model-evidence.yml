name: OpenRouter Free Model Evidence

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Run exactly one synthetic smoke request against this allowlisted free model"
        required: true
        type: choice
        options:
          - cohere/north-mini-code:free
          - google/gemma-4-31b-it:free
          - google/gemma-4-26b-a4b-it:free
          - nvidia/nemotron-3.5-lightning:free
          - nvidia/nemotron-3-super-120b-a12b:free
          - nvidia/nemotron-3-ultra-550b-a55b:free
          - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
          - liquid/lfm-2.5-2.6b:free
          - apodex/apodex-1.1-mini:free

permissions:
  contents: read

jobs:
  smoke:
    name: One-model free endpoint smoke
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run synthetic smoke request
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL_ID: ${{ inputs.model }}
        run: |
          python web-platform/backend/scripts/openrouter_free_model_smoke.py \
            --model "$MODEL_ID" \
            --output artifacts/openrouter-free-model-evidence.json
      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-free-model-evidence
          path: artifacts/openrouter-free-model-evidence.json
          if-no-files-found: ignore
          retention-days: 30