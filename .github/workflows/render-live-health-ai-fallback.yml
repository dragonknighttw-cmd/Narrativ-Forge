name: Render Live Health and AI Fallback Evidence

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/render-live-health-ai-fallback.yml"
      - "web-platform/backend/app/services/ai_adapter.py"
      - "web-platform/backend/app/services/provider_registry.py"
      - "web-platform/backend/app/services/provider_fallback.py"
      - "web-platform/backend/tests/test_ai_adapter.py"
      - "render.yaml"

permissions:
  contents: read

concurrency:
  group: render-live-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-health-and-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-platform/backend
    env:
      RENDER_BASE_URL: https://narrativ-forge.onrender.com
      PYTHONPATH: .
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web-platform/backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Test AI provider routing and deterministic fallback
        run: pytest -q tests/test_ai_adapter.py

      - name: Check live health and readiness endpoints
        id: live-health
        run: |
          mkdir -p "$RUNNER_TEMP/render-live-evidence"
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          base = os.environ["RENDER_BASE_URL"].rstrip("/")
          output = Path(os.environ["RUNNER_TEMP"]) / "render-live-evidence" / "health-checks.json"
          results = {
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "base_url": base,
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "checks": {},
          }
          failed = False

          for path in ("/api/v1/health", "/api/v1/ready"):
              last_error = None
              for attempt in range(1, 46):
                  try:
                      request = urllib.request.Request(
                          base + path,
                          headers={"User-Agent": "Narrativ-Forge-live-smoke/1.0"},
                          method="GET",
                      )
                      with urllib.request.urlopen(request, timeout=10) as response:
                          status_code = response.status
                          raw = response.read().decode("utf-8", errors="replace")
                      body = json.loads(raw)
                      valid = status_code == 200
                      if path.endswith("/health"):
                          valid = valid and body.get("status") == "ok"
                      else:
                          valid = valid and body.get("status") == "ready"
                          checks = body.get("checks") or {}
                          valid = valid and checks.get("database") == "ok"
                          valid = valid and checks.get("redis") in ("ok", "disabled")
                      results["checks"][path] = {
                          "http_status": status_code,
                          "body": body,
                          "attempt": attempt,
                          "passed": bool(valid),
                      }
                      if valid:
                          break
                      last_error = f"Unexpected response: HTTP {status_code}, body={body!r}"
                  except (urllib.error.URLError, TimeoutError, ValueError, OSError) as exc:
                      last_error = f"{type(exc).__name__}: {exc}"
                      results["checks"][path] = {
                          "attempt": attempt,
                          "error_type": type(exc).__name__,
                          "error": str(exc)[:300],
                          "passed": False,
                      }
                  time.sleep(2)
              else:
                  failed = True
                  results["checks"][path]["final_error"] = last_error
                  continue
              if not results["checks"][path].get("passed"):
                  failed = True

          results["overall_passed"] = not failed
          output.write_text(json.dumps(results, indent=2) + "\\n", encoding="utf-8")
          print(json.dumps(results, indent=2))
          if failed:
              raise SystemExit("Render live health/readiness verification failed; inspect the uploaded evidence.")
          PY

      - name: Upload redacted live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-live-health-ai-fallback-evidence
          path: ${{ runner.temp }}/render-live-evidence/health-checks.json
          if-no-files-found: warn
          retention-days: 30
