name: Repository Gate

# Always create one repository-level check so the commit page has a single
# green/red gate without requiring the user to open Actions.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: repository-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  gate:
    name: Repository Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for other checks to settle
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sleep 20
          deadline=$((SECONDS + 1380))
          required_workflows=("CI" "Security" "CodeQL")
          while (( SECONDS < deadline )); do
            runs="$(gh api --paginate --slurp "repos/${REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" | jq '[.[].workflow_runs[]]')"

            missing=0
            failures=0
            pending=0

            for workflow in "${required_workflows[@]}"; do
              row="$(jq -c --arg workflow "${workflow}" '
                map(select(.name == $workflow))
                | sort_by(.run_number)
                | last // empty
              ' <<<"${runs}")"

              if [[ -z "${row}" ]]; then
                echo "Waiting for required workflow: ${workflow}"
                missing=$((missing + 1))
                continue
              fi

              status="$(jq -r '.status' <<<"${row}")"
              conclusion="$(jq -r '.conclusion // "pending"' <<<"${row}")"
              echo "${workflow}: ${status}/${conclusion}"

              if [[ "${status}" != "completed" ]]; then
                pending=$((pending + 1))
              elif [[ "${conclusion}" != "success" ]]; then
                failures=$((failures + 1))
              fi
            done

            # Worker evidence is conditional: if this SHA triggered it, it is
            # part of the gate; docs/config-only commits may legitimately omit it.
            worker="$(jq -c 'map(select(.name == "Real Worker Evidence")) | sort_by(.run_number) | last // empty' <<<"${runs}")"
            if [[ -n "${worker}" ]]; then
              status="$(jq -r '.status' <<<"${worker}")"
              conclusion="$(jq -r '.conclusion // "pending"' <<<"${worker}")"
              echo "Real Worker Evidence: ${status}/${conclusion}"
              if [[ "${status}" != "completed" ]]; then
                pending=$((pending + 1))
              elif [[ "${conclusion}" != "success" ]]; then
                failures=$((failures + 1))
              fi
            fi

            if (( failures > 0 )); then
              echo "Repository Gate: required workflow failure detected."
              exit 1
            fi

            if (( missing == 0 && pending == 0 )); then
              echo "Repository Gate: required workflows completed successfully."
              exit 0
            fi

            sleep 15
          done

          echo "Repository Gate timed out waiting for checks."
          exit 1
