name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        working-directory: apps/web-platform/backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt -r requirements-real-processing.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Require npm lockfile
        working-directory: apps/web-platform/frontend
        run: test -f package-lock.json
      - name: Audit frontend dependencies
        working-directory: apps/web-platform/frontend
        run: |
          npm ci
          npm audit --audit-level=high

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: github/codeql-action/init@v4
        with:
          languages: python,javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Report runner Docker disk state
        run: |
          df -h /
          docker system df || true
      - name: Free disposable Docker state
        run: |
          docker system prune --all --force --volumes
          docker builder prune --all --force
      - name: Build backend image
        run: docker build --tag narrativ-forge-backend:ci --file apps/web-platform/backend/Dockerfile apps/web-platform/backend
      - name: Free disposable Docker build cache
        run: docker builder prune --all --force
      - name: Scan backend image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: narrativ-forge-backend:ci
          format: json
          output: trivy-results.json
          exit-code: "1"
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
      - name: Report exact vulnerable package paths
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path("trivy-results.json")
          if not report.exists():
              print("Trivy JSON report was not produced.")
              raise SystemExit(0)
          data = json.loads(report.read_text())
          found = 0
          for result in data.get("Results", []):
              for vuln in result.get("Vulnerabilities") or []:
                  found += 1
                  print({
                      "target": result.get("Target"),
                      "type": result.get("Type"),
                      "package": vuln.get("PkgName"),
                      "path": vuln.get("PkgPath"),
                      "installed": vuln.get("InstalledVersion"),
                      "fixed": vuln.get("FixedVersion"),
                      "vulnerability": vuln.get("VulnerabilityID"),
                  })
          if not found:
              print("No vulnerabilities were present in the JSON report.")
          PY
