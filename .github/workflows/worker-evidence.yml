name: Real Worker Evidence
# Evidence gate: execute integration suite from source, then real worker smoke.

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "web-platform/backend/**"
      - ".github/workflows/worker-evidence.yml"
      - "render.worker.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "web-platform/backend/**"
      - ".github/workflows/worker-evidence.yml"
      - "render.worker.yaml"

concurrency:
  group: worker-evidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-worker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: narrativ_worker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d narrativ_worker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Pin checkout to the exact triggering SHA
        run: |
          git fetch --no-tags --prune --depth=1 origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "worker-evidence SHA=$(git rev-parse HEAD)"
          sed -n "1,35p" web-platform/backend/app/services/orchestration.py

      - name: Build the production worker image
        run: docker build --pull -f web-platform/backend/Dockerfile.worker -t narrativ-forge-worker-evidence web-platform/backend

      - name: Prepare shared local storage
        run: |
          mkdir -p "$RUNNER_TEMP/narrativ-storage"
          # The production image runs as a non-root user; make the CI bind mount
          # writable without changing the production image's runtime user.
          chmod 0777 "$RUNNER_TEMP/narrativ-storage"

      - name: Apply migrations
        run: |
          docker run --rm --network host             -e DATABASE_URL=postgresql://postgres:ci-test-password@127.0.0.1:5432/narrativ_worker             -e STORAGE_PROVIDER=local             -e UPLOAD_DIR=/app/storage             -v "$RUNNER_TEMP/narrativ-storage:/app/storage"             narrativ-forge-worker-evidence             python -m alembic upgrade head

      - name: Verify retry, DLQ, and tenant integration
        working-directory: web-platform/backend
        run: |
          pip install -r requirements.txt
          DATABASE_URL=postgresql://postgres:ci-test-password@127.0.0.1:5432/narrativ_worker           REDIS_URL=redis://127.0.0.1:6379/0           STORAGE_PROVIDER=local           UPLOAD_DIR="$RUNNER_TEMP/narrativ-storage"           PYTHONPATH=. pytest -m integration -q

      - name: Prewarm deterministic Whisper model cache
        timeout-minutes: 5
        run: |
          docker run --rm --network host             -e XDG_CACHE_HOME=/app/storage/whisper-cache             -v "$RUNNER_TEMP/narrativ-storage:/app/storage"             narrativ-forge-worker-evidence             python -c "import whisper; whisper.load_model('tiny')"

      - name: Start the real worker
        run: |
          docker run -d --name narrativ-worker-evidence --network host             -e APP_ENV=ci             -e DATABASE_URL=postgresql://postgres:ci-test-password@127.0.0.1:5432/narrativ_worker             -e REDIS_URL=redis://127.0.0.1:6379/0             -e STORAGE_PROVIDER=local             -e UPLOAD_DIR=/app/storage             -e WHISPER_MODEL=tiny             -e XDG_CACHE_HOME=/app/storage/whisper-cache             -e CELERY_BEAT_SCHEDULE_FILENAME=/app/storage/celerybeat-schedule             -e WORKER_EVIDENCE_QUEUE=worker_evidence             -e PROCESSING_TIMEOUT_SECONDS=600             -e PROCESSING_TIMEOUT_GRACE_SECONDS=10             -e WORKER_MAX_CONCURRENCY=1             -v "$RUNNER_TEMP/narrativ-storage:/app/storage"             narrativ-forge-worker-evidence             celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --beat --queues=worker_evidence

      - name: Wait for Celery worker and run real-media smoke
        run: |
          for attempt in $(seq 1 20); do
            if docker logs narrativ-worker-evidence 2>&1 | grep -q "ready."; then
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' narrativ-worker-evidence 2>/dev/null | grep -q true; then
              echo "Worker container exited before becoming ready."
              docker logs narrativ-worker-evidence || true
              exit 1
            fi
            sleep 3
          done
          docker logs narrativ-worker-evidence 2>&1 | grep -q "ready." || {
            echo "Celery worker did not become ready within 60 seconds."
            docker logs narrativ-worker-evidence || true
            exit 1
          }
          docker run --rm --network host             -e DATABASE_URL=postgresql://postgres:ci-test-password@127.0.0.1:5432/narrativ_worker             -e REDIS_URL=redis://127.0.0.1:6379/0             -e STORAGE_PROVIDER=local             -e UPLOAD_DIR=/app/storage             -e XDG_CACHE_HOME=/app/storage/whisper-cache             -e PROCESSING_TIMEOUT_SECONDS=600             -e WORKER_EVIDENCE_QUEUE=worker_evidence             -v "$RUNNER_TEMP/narrativ-storage:/app/storage"             narrativ-forge-worker-evidence             env PYTHONPATH=/app python scripts/worker_smoke.py --work-dir /app/storage/worker-smoke --timeout 900

      - name: Show worker logs on failure
        if: failure()
        run: docker logs narrativ-worker-evidence || true

      - name: Stop worker
        if: always()
        run: docker rm -f narrativ-worker-evidence || true
