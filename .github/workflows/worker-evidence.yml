name: Real Worker Evidence
# Evidence gate: execute integration suite from source, then real worker smoke.

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "web-platform/backend/**"
      - ".github/workflows/worker-evidence.yml"
      - "render.worker.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "web-platform/backend/**"
      - ".github/workflows/worker-evidence.yml"
      - "render.worker.yaml"

concurrency:
  group: worker-evidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-worker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: narrativ_worker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d narrativ_worker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Pin checkout to the exact triggering SHA
        run: |
          git fetch --no-tags --prune --depth=1 origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "worker-evidence SHA=$(git rev-parse HEAD)"
          sed -n "1,35p" web-platform/backend/app/services/orchestration.py

      - name: Build the production worker image
        run: docker build --pull -f web-platform/backend/Dockerfile.worker -t narrativ-forge-worker-evidence web-platform/backend

      - name: Prepare shared local storage
        run: |
          mkdir -p "$RUNNER_TEMP/narrativ-storage"
          # The production image runs as a non-root user; make the CI bind mount
          # writable without changing the production image's runtime user.
          chmod 0777 "$RUNNER_TEMP/narrativ-storage"

      - name: Apply migrations
        run: |
          docker run --rm --network host             -e DATABASE_URL=postgresql://postgres:ci-test-password@127.0.0.1:5432/narrativ_worker             -e STORAGE_PROVIDER=local             -e UPLOAD_DIR=/app/storage             -v "$RUNNER_TEMP/narrativ-storage:/app/storage"             narrativ-forge-worker-evidence             python -m alembic upgrade head

      - name: Normalize shared storage ownership for the production worker user
        run: |
          # Migrations intentionally run as root, while the production worker image
          # runs as the non-root "app" user. chmod alone is not a reliable contract
          # for a bind mount, so resolve the image UID/GID and chown the whole shared
          # volume to the exact runtime identity before starting the real worker.
          APP_UID="$(docker run --rm narrativ-forge-worker-evidence id -u app)"
          APP_GID="$(docker run --rm narrativ-forge-worker-evidence id -g app)"
          echo "worker runtime uid=$APP_UID gid=$APP_GID"
          docker run --rm --user 0:0             -v "$RUNNER_TEMP/narrativ-storage:/app/storage"             narrativ-forge-worker-evidence             sh -lc "chown -R $APP_UID:$APP_GID /app/storage && chmod -R a+rwX /app/storage && find /app/storage -type d -exec chmod 0770 {} + && find /app/storage -type f -exec chmod 0660 {} +"
          stat -c '%U:%G %a %n' "$RUNNER_TEMP/narrativ-storage" || true
          find "$RUNNER_TEMP/narrativ-storage" -maxdepth 3 -type d -print | sort | head -80

      - name: Verify production worker storage access before starting the worker
        run: |
          # This is a fail-fast gate: prove that the exact non-root production user
          # can create the same object path that the real processing task will use.
          docker run --rm --network host             -e STORAGE_PROVIDER=local             -e UPLOAD_DIR=/app/storage             -v "$RUNNER_TEMP/narrativ-storage:/app/storage"             narrativ-forge-worker-evidence             sh -lc 'set -eu; id; mkdir -p /app/storage/objects/episodes/preflight/assets/v1/video; printf preflight > /app/storage/objects/episodes/preflight/assets/v1/video/write-test.mp4; test -s /app/storage/objects/episodes/preflight/assets/v1/video/write-test.mp4; rm -rf /app/storage/objects/episodes/preflight; mkdir -p /app/storage/worker-smoke; touch /app/storage/worker-smoke/.write-test; rm /app/storage/worker-smoke/.write-test'
          echo "production worker storage preflight: PASS"

      - name: Verify retry, DLQ, and tenant integration
        working-directory: web-platform/backend
        run: |
          # Keep integration-test storage isolated from the production-worker
          # evidence volume. Tests are allowed to create/delete local objects;
          # they must not mutate the ownership/mode contract of the real worker.
          rm -rf "$RUNNER_TEMP/narrativ-integration-storage"
          mkdir -p "$RUNNER_TEMP/narrativ-integration-storage"
          chmod 0777 "$RUNNER_TEMP/narrativ-integration-storage"
          pip install -r requirements.txt
          DATABASE_URL=postgresql://postgres:ci-test-password@127.0.0.1:5432/narrativ_worker           REDIS_URL=redis://127.0.0.1:6379/0           STORAGE_PROVIDER=local           UPLOAD_DIR="$RUNNER_TEMP/narrativ-integration-storage"           PYTHONPATH=. pytest -m integration -q

      - name: Prewarm deterministic Whisper model cache
        timeout-minutes: 5
        run: |
          docker run --rm --network host             -e XDG_CACHE_HOME=/app/storage/whisper-cache             -v "$RUNNER_TEMP/narrativ-storage:/app/storage"             narrativ-forge-worker-evidence             python -c "import whisper; whisper.load_model('tiny')"

      - name: Re-normalize worker storage after all test activity
        run: |
          # Integration tests and model prewarm can create directories after the
          # first normalization. Make the final worker volume authoritative again
          # immediately before the real worker starts.
          APP_UID="$(docker run --rm narrativ-forge-worker-evidence id -u app)"
          APP_GID="$(docker run --rm narrativ-forge-worker-evidence id -g app)"
          docker run --rm --user 0:0             -v "$RUNNER_TEMP/narrativ-storage:/app/storage"             narrativ-forge-worker-evidence             sh -lc "chown -R $APP_UID:$APP_GID /app/storage && chmod -R a+rwX /app/storage && find /app/storage -type d -exec chmod 0770 {} + && find /app/storage -type f -exec chmod 0660 {} +"
          echo "final worker storage ownership: uid=$APP_UID gid=$APP_GID"
          docker run --rm             -v "$RUNNER_TEMP/narrativ-storage:/app/storage"             narrativ-forge-worker-evidence             sh -lc 'set -eu; id; test -d /app/storage/objects; mkdir -p /app/storage/objects/episodes/preflight-final; test -w /app/storage/objects/episodes/preflight-final; printf ok > /app/storage/objects/episodes/preflight-final/probe; test -s /app/storage/objects/episodes/preflight-final/probe; rm -rf /app/storage/objects/episodes/preflight-final'
          echo "final production worker storage preflight: PASS"

      - name: Start the real worker
        run: |
          docker run -d --name narrativ-worker-evidence --network host             -e APP_ENV=ci             -e DATABASE_URL=postgresql://postgres:ci-test-password@127.0.0.1:5432/narrativ_worker             -e REDIS_URL=redis://127.0.0.1:6379/0             -e STORAGE_PROVIDER=local             -e UPLOAD_DIR=/app/storage             -e WHISPER_MODEL=tiny             -e XDG_CACHE_HOME=/app/storage/whisper-cache             -e CELERY_BEAT_SCHEDULE_FILENAME=/app/storage/celerybeat-schedule             -e WORKER_EVIDENCE_QUEUE=worker_evidence             -e PROCESSING_TIMEOUT_SECONDS=600             -e PROCESSING_TIMEOUT_GRACE_SECONDS=10             -e WORKER_MAX_CONCURRENCY=1             -v "$RUNNER_TEMP/narrativ-storage:/app/storage"             narrativ-forge-worker-evidence             sh -lc 'set -eu; echo "worker runtime:"; id; test -w /app/storage; mkdir -p /app/storage/objects/episodes/runtime-preflight; test -w /app/storage/objects/episodes/runtime-preflight; rm -rf /app/storage/objects/episodes/runtime-preflight; exec celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --beat --queues=worker_evidence'

      - name: Wait for Celery worker and run real-media smoke
        run: |
          for attempt in $(seq 1 20); do
            if docker logs narrativ-worker-evidence 2>&1 | grep -q "ready."; then
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' narrativ-worker-evidence 2>/dev/null | grep -q true; then
              echo "Worker container exited before becoming ready."
              docker logs narrativ-worker-evidence || true
              exit 1
            fi
            sleep 3
          done
          docker logs narrativ-worker-evidence 2>&1 | grep -q "ready." || {
            echo "Celery worker did not become ready within 60 seconds."
            docker logs narrativ-worker-evidence || true
            exit 1
          }
          docker run --rm --network host             -e DATABASE_URL=postgresql://postgres:ci-test-password@127.0.0.1:5432/narrativ_worker             -e REDIS_URL=redis://127.0.0.1:6379/0             -e STORAGE_PROVIDER=local             -e UPLOAD_DIR=/app/storage             -e XDG_CACHE_HOME=/app/storage/whisper-cache             -e PROCESSING_TIMEOUT_SECONDS=600             -e WORKER_EVIDENCE_QUEUE=worker_evidence             -v "$RUNNER_TEMP/narrativ-storage:/app/storage"             narrativ-forge-worker-evidence             env PYTHONPATH=/app python scripts/worker_smoke.py --work-dir /app/storage/worker-smoke --timeout 900

      - name: Show worker logs on failure
        if: failure()
        run: docker logs narrativ-worker-evidence || true

      - name: Stop worker
        if: always()
        run: docker rm -f narrativ-worker-evidence || true
