<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="nfBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="nfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Tile -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#140f1a" stroke="url(#nfBorderGrad)" stroke-width="3.5" />

  <!-- Inner Ambient Amber Fill -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="rgba(245, 158, 11, 0.05)" />

  <!-- Exact Scaled Clapperboard Glyph (Transform from 24x24) -->
  <g transform="translate(18, 18) scale(2.666)" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#nfGlow)">
    <!-- Clapper Top Stick -->
    <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z" />
    <path d="m6.2 5.3 3.1 3.9" stroke="#fde047" />
    <path d="m12.4 3.4 3.1 4" stroke="#fde047" />
    <!-- Clapper Body -->
    <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
    <!-- Play Triangle Core -->
    <polygon points="10,13.5 15,16 10,18.5" fill="#fde047" stroke="none" />
  </g>
</svg>