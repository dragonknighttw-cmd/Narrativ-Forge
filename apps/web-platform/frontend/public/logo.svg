<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Deep Cosmic Nebula Glow -->
    <radialGradient id="nfNebulaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#ec4899" stop-opacity="0.12" />
      <stop offset="75%" stop-color="#8b5cf6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#05050b" stop-opacity="0" />
    </radialGradient>

    <!-- Sleek Chiseled Blade Gradients: Ember Gold to Cosmic Violet -->
    <linearGradient id="bladeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>

    <linearGradient id="bladeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="45%" stop-color="#e11d48" />
      <stop offset="85%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>

    <linearGradient id="bladeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="45%" stop-color="#7c3aed" />
      <stop offset="85%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Star Core Prism Gradient -->
    <linearGradient id="coreStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Anamorphic Flare Gradient -->
    <linearGradient id="flareGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="60%" stop-color="#fb7185" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0" />
    </linearGradient>

    <!-- Precision Glow Filter -->
    <filter id="nfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="nfCoreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="250" cy="250" r="225" fill="url(#nfNebulaGlow)" />

  <!-- ================= SLEEK CHISELED APERTURE SHUTTER ================= -->
  <!-- 6 Sleek, Tapered, Angular Blades (Geometric Chisel, NOT round) -->
  <g transform="translate(250, 250)">
    
    <!-- Blade 1 (0 deg - Golden Ember) -->
    <!-- Sleek tapered polygon blade with sharp outer tip and inner iris edge -->
    <polygon points="0,-185 85,-145 130,-45 42,24 -24,-42" 
             fill="url(#bladeGrad1)" 
             stroke="#fde047" 
             stroke-width="1.5" 
             stroke-linejoin="round" 
             opacity="0.95" />

    <!-- Blade 2 (60 deg - Sunset Amber) -->
    <g transform="rotate(60)">
      <polygon points="0,-185 85,-145 130,-45 42,24 -24,-42" 
               fill="url(#bladeGrad1)" 
               stroke="#fbbf24" 
               stroke-width="1.5" 
               stroke-linejoin="round" 
               opacity="0.9" />
    </g>

    <!-- Blade 3 (120 deg - Crimson Rose) -->
    <g transform="rotate(120)">
      <polygon points="0,-185 85,-145 130,-45 42,24 -24,-42" 
               fill="url(#bladeGrad2)" 
               stroke="#f43f5e" 
               stroke-width="1.5" 
               stroke-linejoin="round" 
               opacity="0.95" />
    </g>

    <!-- Blade 4 (180 deg - Magenta Violet) -->
    <g transform="rotate(180)">
      <polygon points="0,-185 85,-145 130,-45 42,24 -24,-42" 
               fill="url(#bladeGrad2)" 
               stroke="#ec4899" 
               stroke-width="1.5" 
               stroke-linejoin="round" 
               opacity="0.9" />
    </g>

    <!-- Blade 5 (240 deg - Electric Indigo) -->
    <g transform="rotate(240)">
      <polygon points="0,-185 85,-145 130,-45 42,24 -24,-42" 
               fill="url(#bladeGrad3)" 
               stroke="#a855f7" 
               stroke-width="1.5" 
               stroke-linejoin="round" 
               opacity="0.95" />
    </g>

    <!-- Blade 6 (300 deg - Cosmic Royal) -->
    <g transform="rotate(300)">
      <polygon points="0,-185 85,-145 130,-45 42,24 -24,-42" 
               fill="url(#bladeGrad3)" 
               stroke="#6366f1" 
               stroke-width="1.5" 
               stroke-linejoin="round" 
               opacity="0.9" />
    </g>

    <!-- Inner Hexagonal Iris Aperture Trim (Polished Metallic Bevel) -->
    <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" 
             fill="#090514" 
             stroke="#fde047" 
             stroke-width="2.5" 
             stroke-linejoin="round" />

    <!-- ================= ANAMORPHIC HORIZONTAL LENS FLARE ================= -->
    <ellipse cx="0" cy="0" rx="145" ry="2.2" fill="url(#flareGrad)" filter="url(#nfGlow)" />
    <ellipse cx="0" cy="0" rx="65" ry="1.2" fill="#ffffff" />

    <!-- ================= RADIANT STORY STAR / PLAY FORGE PRISM ================= -->
    <g filter="url(#nfCoreGlow)">
      <!-- 4-Pointed Celestial Forge Star -->
      <path d="M 0 -34 
               C 3 -11, 11 -3, 34 0 
               C 11 3, 3 11, 0 34 
               C -3 11, -11 3, -34 0 
               C -11 -3, -3 -11, 0 -34 Z" 
            fill="url(#coreStarGrad)" />

      <!-- Center Dynamic Play Beacon (Subtle Video Narrative Motif) -->
      <polygon points="-7,-10 13,0 -7,10" fill="#090514" opacity="0.9" />
      <polygon points="-5,-8 10,0 -5,8" fill="#ffffff" opacity="0.95" />
    </g>
  </g>
</svg>
