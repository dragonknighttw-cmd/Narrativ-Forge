<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Deep Cosmic Nebula Glow -->
    <radialGradient id="nfNebulaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28" />
      <stop offset="40%" stop-color="#ec4899" stop-opacity="0.14" />
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#05050b" stop-opacity="0" />
    </radialGradient>

    <!-- Blade Gradients: Rich Ember to Cosmic Violet -->
    <linearGradient id="bladeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>

    <linearGradient id="bladeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="45%" stop-color="#ec4899" />
      <stop offset="85%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#1e112a" />
    </linearGradient>

    <linearGradient id="bladeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="85%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Star Core Prism Gradient -->
    <linearGradient id="coreStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Anamorphic Flare Gradient -->
    <linearGradient id="flareGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="60%" stop-color="#fb7185" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="nfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="nfCoreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="250" cy="250" r="225" fill="url(#nfNebulaGlow)" />

  <!-- Outer Celestial Cinematic Track (Orbit & Film Ticks) -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="rgba(244, 63, 94, 0.22)" stroke-width="1.5" stroke-dasharray="3 9" />
  <circle cx="250" cy="250" r="195" fill="none" stroke="rgba(245, 158, 11, 0.28)" stroke-width="2" />

  <!-- Film Shutter Ticks around rim -->
  <g stroke="#f59e0b" stroke-width="2" opacity="0.65">
    <line x1="250" y1="42" x2="250" y2="52" />
    <line x1="250" y1="448" x2="250" y2="458" />
    <line x1="42" y1="250" x2="52" y2="250" />
    <line x1="448" y1="250" x2="458" y2="250" />
    <circle cx="104" cy="104" r="3" fill="#ec4899" opacity="0.8" />
    <circle cx="396" cy="104" r="3" fill="#f59e0b" opacity="0.8" />
    <circle cx="104" cy="396" r="3" fill="#8b5cf6" opacity="0.8" />
    <circle cx="396" cy="396" r="3" fill="#f43f5e" opacity="0.8" />
  </g>

  <!-- ================= VORTEX APERTURE BLADES (NARRATIVE FORGE WHEEL) ================= -->
  <g transform="translate(250, 250)">
    <!-- Blade 1 (0 deg - Golden Ember) -->
    <path d="M 0 -170 
             C 70 -170, 155 -125, 175 -50 
             C 185 -15, 170 30, 130 50 
             C 80 75, 45 40, 25 10 
             C 10 -20, 0 -60, 0 -170 Z" 
          fill="url(#bladeGrad1)" 
          opacity="0.95" />

    <!-- Blade 2 (60 deg - Sunset Amber) -->
    <g transform="rotate(60)">
      <path d="M 0 -170 
               C 70 -170, 155 -125, 175 -50 
               C 185 -15, 170 30, 130 50 
               C 80 75, 45 40, 25 10 
               C 10 -20, 0 -60, 0 -170 Z" 
            fill="url(#bladeGrad1)" 
            opacity="0.9" />
    </g>

    <!-- Blade 3 (120 deg - Crimson Rose) -->
    <g transform="rotate(120)">
      <path d="M 0 -170 
               C 70 -170, 155 -125, 175 -50 
               C 185 -15, 170 30, 130 50 
               C 80 75, 45 40, 25 10 
               C 10 -20, 0 -60, 0 -170 Z" 
            fill="url(#bladeGrad2)" 
            opacity="0.95" />
    </g>

    <!-- Blade 4 (180 deg - Magenta Violet) -->
    <g transform="rotate(180)">
      <path d="M 0 -170 
               C 70 -170, 155 -125, 175 -50 
               C 185 -15, 170 30, 130 50 
               C 80 75, 45 40, 25 10 
               C 10 -20, 0 -60, 0 -170 Z" 
            fill="url(#bladeGrad2)" 
            opacity="0.9" />
    </g>

    <!-- Blade 5 (240 deg - Electric Indigo) -->
    <g transform="rotate(240)">
      <path d="M 0 -170 
               C 70 -170, 155 -125, 175 -50 
               C 185 -15, 170 30, 130 50 
               C 80 75, 45 40, 25 10 
               C 10 -20, 0 -60, 0 -170 Z" 
            fill="url(#bladeGrad3)" 
            opacity="0.95" />
    </g>

    <!-- Blade 6 (300 deg - Cosmic Royal) -->
    <g transform="rotate(300)">
      <path d="M 0 -170 
               C 70 -170, 155 -125, 175 -50 
               C 185 -15, 170 30, 130 50 
               C 80 75, 45 40, 25 10 
               C 10 -20, 0 -60, 0 -170 Z" 
            fill="url(#bladeGrad3)" 
            opacity="0.9" />
    </g>

    <!-- Inner Core Aperture Ring (Polished Bevel Highlight) -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#fde047" stroke-width="2.5" opacity="0.85" />
    <circle cx="0" cy="0" r="48" fill="#090514" />

    <!-- ================= ANAMORPHIC HORIZONTAL LENS FLARE ================= -->
    <ellipse cx="0" cy="0" rx="140" ry="2.5" fill="url(#flareGrad)" filter="url(#nfGlow)" />
    <ellipse cx="0" cy="0" rx="60" ry="1.5" fill="#ffffff" />

    <!-- ================= RADIANT STORY STAR / PLAY FORGE PRISM ================= -->
    <g filter="url(#nfCoreGlow)">
      <!-- 4-Pointed Celestial Forge Star -->
      <path d="M 0 -36 
               C 3 -12, 12 -3, 36 0 
               C 12 3, 3 12, 0 36 
               C -3 12, -12 3, -36 0 
               C -12 -3, -3 -12, 0 -36 Z" 
            fill="url(#coreStarGrad)" />

      <!-- Center Dynamic Play Beacon (Subtle Video Narrative Motif) -->
      <polygon points="-8,-12 14,0 -8,12" fill="#090514" opacity="0.85" />
      <polygon points="-6,-9 11,0 -6,9" fill="#ffffff" opacity="0.95" />
    </g>
  </g>
</svg>
