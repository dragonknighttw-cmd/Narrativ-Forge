services:
  - type: web
    name: narrativ-forge-api
    runtime: docker
    rootDir: web-platform/backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    startCommand: sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000'
    envVars:
      - key: APP_ENV
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: UPLOAD_DIR
        value: /var/lib/narrativ-forge/uploads
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: narrativ-forge
      - key: CLOUDINARY_CHUNK_SIZE_BYTES
        value: "20971520"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: OAUTH_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      - key: SINGLE_USER_MODE
        value: "true"
      - key: SINGLE_USER_EMAIL
        sync: false

# Long-running Celery/FFmpeg/Whisper workers are intentionally not declared here.
# Render does not provide free Background Workers. Keep worker runtime files in
# the repository for a future paid worker deployment, but keep this blueprint
# free-only so syncing it cannot silently create billable services.
