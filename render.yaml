services:
  - type: web
    name: Narrativ-Forge
    runtime: docker
    rootDir: apps/web-platform/backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    # Never run database migrations automatically during service startup.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: UPLOAD_DIR
        value: /var/lib/narrativ-forge/uploads
      - key: STORAGE_PROVIDER
        value: hybrid
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: narrativ-forge
      - key: CLOUDINARY_CHUNK_SIZE_BYTES
        value: "20971520"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_OWNER_USER_ID
        sync: false
      - key: SUPABASE_OWNER_EMAIL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: narrativ-forge
      - key: SUPABASE_SIGNED_URL_EXPIRY_SECONDS
        value: "900"
      - key: B2_APPLICATION_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_ENDPOINT_URL
        sync: false
      - key: B2_SIGNED_URL_EXPIRY_SECONDS
        value: "900"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: OAUTH_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      - key: SINGLE_USER_MODE
        value: "true"
      - key: SINGLE_USER_EMAIL
        sync: false
      - key: CLOUDFLARE_WHISPER_WORKER_URL
        sync: false
      - key: CLOUDFLARE_WHISPER_SHARED_SECRET
        sync: false
      - key: CLOUDFLARE_WHISPER_TOKEN_TTL_SECONDS
        value: "300"
      - key: CLOUDFLARE_WHISPER_DAILY_NEURON_BUDGET
        value: "10000"
      - key: CLOUDFLARE_WHISPER_WARNING_THRESHOLD
        value: "0.80"
      - key: CLOUDFLARE_WHISPER_FALLBACK_THRESHOLD
        value: "0.95"
      - key: CLOUDFLARE_WHISPER_NEURONS_PER_AUDIO_MINUTE
        value: "41.14"


      # Free-first content generation. Secrets are entered in Render, never committed.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODELS
        value: google/gemma-4-31b-it:free,cohere/north-mini-code:free,nvidia/nemotron-3-super-120b-a12b:free,liquid/lfm-2.5-2.6b:free
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_FREE_TIER_ENABLED
        value: "false"
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_AI_MODEL
        value: "@cf/meta/llama-3.1-8b-instruct"
      - key: CLOUDFLARE_AI_FREE_TIER_ENABLED
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_FREE_TIER_ENABLED
        value: "false"
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_BASE_URL
        value: https://api.mistral.ai/v1
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      - key: MISTRAL_FREE_TIER_ENABLED
        value: "false"
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_BASE_URL
        value: https://api.cohere.ai/compatibility/v1
      - key: COHERE_MODEL
        value: command-r-08-2024
      - key: COHERE_FREE_TIER_ENABLED
        value: "false"
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL
        value: meta/llama-3.3-70b-instruct
      - key: NVIDIA_FREE_TIER_ENABLED
        value: "false"
      - key: AI_PROVIDER_TIMEOUT_SECONDS
        value: "45"

  - type: web
    name: narrativ-forge-frontend
    runtime: node
    rootDir: apps/web-platform/frontend
    buildCommand: >-
      npm ci && npm run build &&
      if [ -d public ]; then cp -R public .next/standalone/; fi &&
      mkdir -p .next/standalone/.next &&
      cp -R .next/static .next/standalone/.next/static
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

# Long-running Celery/FFmpeg/Whisper workers are intentionally not declared here.
# Render does not provide free Background Workers. Keep worker runtime files in
# the repository for a future paid worker deployment, but keep this blueprint
# free-only so syncing it cannot silently create billable services.
